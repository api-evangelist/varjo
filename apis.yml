aid: varjo
name: Varjo
description: >-
  Varjo is a Helsinki-based maker of high-fidelity virtual and mixed reality
  headsets for professional training and simulation across air, land, and sea.
  Its platform centers on the XR-4 Series headsets and the Varjo Base companion
  software, with a developer surface built around a native C SDK (rendering,
  foveated rendering, mixed reality, eye and hand tracking, DataStream API),
  the Varjo XR Plugin for Unity, an OpenXR plugin for Unreal Engine, and WebXR
  support. Varjo ships its own Khronos OpenXR runtime and is a contributing
  member of the OpenXR working group.
